model:
  d_model: 64
  front_context: window_cnn_v1
  historical_threshold: 0.7
  historical_topk: 4
  point_refiner_span: 32
  recovery_rounds: 1
  recovery_schedule: iterative_tv_h_v1
  residual_scale: 0.1
  temporal_boundaries:
  - 2
  - 4
  - 8
  - 16
  temporal_local_radius: 2
  variable_offsets:
  - -1
  - 0
  - 1
  variable_selection: window_context_topk_v1
  variable_topk: 4
  point_router: none
  overlap_fusion: none
training:
  batch_size: 128
  retrieval_loss_weight: 0.1
  seed: 502
  specialist_exposure: 0.2
  stage1_epochs: 100
  stage1_lr: 0.001
  stage1_objective: global_mse_v1
  stage2_epochs: 100
  stage2_lr: 0.0001
  weight_decay: 0.0
  stage1_structure: recent_state_v1
